    <!--GOOGLE FONTS - NUNITO -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-dark bg-transparent fixed-top">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html"><img src="../assets/img/logo/logo_mirtilo.png" alt="logotipo"></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasDarkNavbar" aria-controls="offcanvasDarkNavbar" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
        </nav>
        <div class="offcanvas offcanvas-end minha-offcanvas navbar-dark" tabindex="-1" id="offcanvasDarkNavbar" aria-labelledby="offcanvasDarkNavbarLabel">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="offcanvasDarkNavbarLabel"><img id="offcanvas_img" src="../assets/img/logo/logo.ico" alt="">Mirtilo the Dog</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="sobre.html">Sobre nós</a>
                    </li>
                    <li class="nav-item">
                        <div class="accordion" id="accordionExample">
                            <div class="accordion-item">
                                <h2 class="accordion-header">
                                <button class="accordion-button collapsed bg-transparent shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne">
                                    <a class="nav-link active" href="catalogo.html">Catálogo</a>
                                </button>
                                </h2>
                                <div id="collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                                    <div class="accordion-body pt-0">
                                        <div>
                                            <a class="nav-link" href="catalogo.html?categoria=todos">Todos</a>
                                        </div>
                                        <div>
                                            <a class="nav-link" href="catalogo.html?categoria=colar">Colares</a>
                                        </div>
                                        <div>
                                            <a class="nav-link" href="catalogo.html?categoria=conta">Contas</a>
                                        </div>
                                        <div>
                                            <a class="nav-link" href="catalogo.html?categoria=porta-chaves">Porta-chaves</a>
                                        </div>
                                        <div>
                                            <a class="nav-link" href="catalogo.html?categoria=personalizado">Personalize o seu</a>
                                        </div>
                                        <div>
                                            <a class="nav-link" href="catalogo.html?categoria=news">Novidades</a>
                                        </div> 
                                    </div>
                                </div>
                            </div>
                        </div>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="pedido.html">Faça o seu pedido</a>
                    </li>
                </ul>
            </div>
        </div>
    </header>
    <main id="main-catalogo" class="d-flex flex-column align-items-center flex-grow-1 text-center px-3">
        <div id="titulo-catalogo" class="d-flex text-center justify-content-center">
            <h1>Catálogo</h1>
        </div>

        <div id="filtro-preco">
            <span style="font-weight: 600; color: var(--violeta_intenso);">
                <i class="bi bi-funnel-fill me-1"></i>Preço
            </span>
            
            <input type="number" id="precoMin" placeholder="Mín €" min="0">
            
            <span style="color: var(--violeta_escuro);">—</span>
            
            <input type="number" id="precoMax" placeholder="Máx €" min="0">
            
            <button id="btn-aplicar" onclick="aplicarFiltroPreco()" onmouseover="this.style.backgroundColor='var(--violeta_escuro)'"
                onmouseout="this.style.backgroundColor='var(--violeta_intenso)'">
                Aplicar
            </button>
            
            <button id="btn-limpar" onclick="limparFiltroPreco()" onmouseover="this.style.backgroundColor='rgba(160,130,202,0.15)'"
                onmouseout="this.style.backgroundColor='transparent'">
                Limpar
            </button>
        </div>
        <div class="container">
            <div id="produtos" class="row justify-content-center"></div>
        </div>
    </main>
    <footer class="container-fluid text-center p-3 mt-auto fixed-bottom">
        <div class="row">
            <div>
                <p>&copy; Mirtilo the Dog</p>
                <a href="https://www.facebook.com/mirtilothedog" target="_blank"><i class="bi bi-facebook mx-5"></i></a>
                <a href="https://www.instagram.com/mirtilothedog/" target="_blank"><i class="bi bi-instagram mx-5"></i></a>
            </div>
        </div>
    </footer>
